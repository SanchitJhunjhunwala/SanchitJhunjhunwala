<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Toralhelix in Animaterial</title>

<style>
body {
 margin:0;
 background:black;
 color:white;
 font-family: "Baskerville Old Face", Baskerville, "Times New Roman", serif;
}

/* Prevent iOS issues */
body, button, #ui, #geom {
 -webkit-user-select: none;
 user-select: none;
 -webkit-touch-callout: none;
 -webkit-tap-highlight-color: transparent;
 touch-action: manipulation;
}

/* ===== LOGO ===== */
#logo {
 position:absolute;
 top:10px;
 left:10px;
 width:320px;
 z-index:10;
 pointer-events:none;
 opacity:0.9;
}

/* ===== PANELS ===== */
#ui, #geom {
 position:absolute;
 left:10px;
 background:rgba(0,0,0,0.6);
 backdrop-filter: blur(6px);
 padding:12px;
 border-radius:12px;
 transition: opacity 0.4s ease;
}

/* Dynamic stacking */
#geom { bottom:10px; z-index:4; }
#ui { z-index:5; }

/* ===== RUN BLOCK ===== */
.runBlock {
 margin-top:12px;
 padding:6px 8px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-radius:10px;
 background:rgba(255,255,255,0.05);
 border:1px solid rgba(255,255,255,0.1);
}

label { display:block; margin-top:8px; font-size:14px; }

input[type=range] {
 -webkit-appearance:none;
 width:140px;
 height:2px;
 background:#888;
 border-radius:2px;
}

input[type=range]::-webkit-slider-thumb {
 -webkit-appearance:none;
 width:10px;
 height:10px;
 background:white;
 border-radius:50%;
}

button {
 font-family: inherit;
 font-size:14px;
 padding:6px 10px;
 border-radius:8px;
 border:1px solid rgba(255,255,255,0.2);
 background:transparent;
 color:white;
}

.inputRow {
 display:flex;
 gap:6px;
 align-items:center;
}

/* ===== SWITCH ===== */
.switch {
 position: relative;
 display: inline-block;
 width: 42px;
 height: 22px;
}

.switch input { display:none; }

.slider {
 position:absolute;
 top:0; left:0; right:0; bottom:0;
 background:rgba(255,255,255,0.2);
 border-radius:20px;
}

.slider:before {
 content:"";
 position:absolute;
 height:18px;
 width:18px;
 left:2px;
 bottom:2px;
 background:white;
 border-radius:50%;
 transition:0.2s;
}

input:checked + .slider {
 background:rgba(255,255,255,0.7);
}

input:checked + .slider:before {
 transform:translateX(20px);
}
</style>
</head>

<body>

<img id="logo" src="animaterial_logo.svg">

<div id="ui">
<b>Dynamics</b>

<label>Wave k <input type="range" id="k" min="0" max="15" step="0.1" value="2"></label>
<label>Current <input type="range" id="Iamp" min="0" max="5" step="0.1" value="1"></label>

<label>Mass <input type="range" id="mass" min="0" max="5" step="0.1" value="1"></label>
<label>Base stiffness <input type="range" id="ks" min="0" max="5" step="0.1" value="1"></label>
<label>Neighbor stiffness <input type="range" id="kn" min="0" max="5" step="0.1" value="2"></label>
<label>Damping <input type="range" id="c" min="0" max="3" step="0.1" value="0.5"></label>

<label><input type="checkbox" id="showLine"> Show line</label>



<div class="runBlock">
  <span>Run</span>
  <label class="switch">
    <input type="checkbox" id="runToggle">
    <span class="slider"></span>
  </label>
</div>

<button onclick="resetSim()">Reset</button>
</div>

<div id="geom">
<b>Geometry</b>

<label>Turns <input type="range" id="turns" min="2" max="25" value="8"></label>

<label>a
<div class="inputRow">
<button onmousedown="startStep('a', -1)" onmouseup="stopStep()" onmouseleave="stopStep()">−</button>
<input type="number" id="a" value="50">
<button onmousedown="startStep('a', 1)" onmouseup="stopStep()" onmouseleave="stopStep()">+</button>
</div>
</label>

<label>b
<div class="inputRow">
<button onmousedown="startStep('b', -1)" onmouseup="stopStep()" onmouseleave="stopStep()">−</button>
<input type="number" id="b" value="20">
<button onmousedown="startStep('b', 1)" onmouseup="stopStep()" onmouseleave="stopStep()">+</button>
</div>
</label>

<label>R
<div class="inputRow">
<button onmousedown="startStep('R', -2)" onmouseup="stopStep()" onmouseleave="stopStep()">−</button>
<input type="number" id="R" value="100">
<button onmousedown="startStep('R', 2)" onmouseup="stopStep()" onmouseleave="stopStep()">+</button>
</div>
</label>

<label>Bz <input type="range" id="Bz" min="0" max="5" step="0.1" value="1"></label>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>

/* ===== DYNAMIC PANEL STACKING ===== */
function layoutPanels(){
 const geom = document.getElementById("geom");
 const ui = document.getElementById("ui");

 if(!geom || !ui) return;

 const geomHeight = geom.offsetHeight;
 ui.style.bottom = (geomHeight + 20) + "px";
}

window.addEventListener("load", () => setTimeout(layoutPanels, 50));
window.addEventListener("resize", layoutPanels);

/* ===== HOLD ===== */
let holdInterval=null;
function startStep(id,delta){
 stopStep();
 holdInterval=setInterval(()=>{
  let el=document.getElementById(id);
  el.value=parseFloat(el.value)+delta;
  updateGeom();
 },100);
}
function stopStep(){
 if(holdInterval){clearInterval(holdInterval);holdInterval=null;}
}

/* ===== THREE ===== */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,5000);
const renderer=new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

let azim=0,elev=0.5,radius=400;

function updateCamera(){
 camera.position.set(
  radius*Math.cos(elev)*Math.sin(azim),
  radius*Math.sin(elev),
  radius*Math.cos(elev)*Math.cos(azim)
 );
 camera.lookAt(0,0,0);
}

/* ===== SIM ===== */
let base=[], pos=[], vel=[], geo, mat, t=0;

let pointsObj = null;
let lineObj = null;

function generate(){
 let pts=[],steps=800;
 let turnsVal=+turns.value,aVal=+a.value,bVal=+b.value,RVal=+R.value;

 for(let i=0;i<steps;i++){
  let p=i/steps;
  let th=turnsVal*2*Math.PI*p;

  let z=(p<0.25)?4*p*bVal:
        (p<0.5)?bVal-(4*p*bVal-bVal):
        (p<0.75)?-(4*p*bVal)+2*bVal:
        -4*bVal+4*p*bVal;

  let core=Math.sqrt(Math.max(0,aVal*aVal*(1-(z*z)/(bVal*bVal))));
  let r=(p<0.25||p>=0.75)?(RVal-core):(RVal+core);

  pts.push(new THREE.Vector3(r*Math.cos(th),r*Math.sin(th),z));
 }
 return pts;
}

function init(){

/* ===== CLEAN OLD OBJECTS ===== */
if(pointsObj){
 scene.remove(pointsObj);
 pointsObj.geometry.dispose();
 pointsObj.material.dispose();
 pointsObj = null;
}

if(lineObj){
 scene.remove(lineObj);
 lineObj.geometry.dispose();
 lineObj.material.dispose();
 lineObj = null;
}

/* ===== REBUILD ===== */
base = generate();
pos = base.map(p=>p.clone());
vel = base.map(()=>new THREE.Vector3());

geo = new THREE.BufferGeometry().setFromPoints(pos);

mat = new THREE.PointsMaterial({
 vertexColors:true,
 size:3
});

pointsObj = new THREE.Points(geo, mat);
scene.add(pointsObj);
}

function updateGeom(){
 base=generate();
 for(let i=0;i<pos.length;i++){
  pos[i].lerp(base[i],0.3);
 }
}

["a","b","R","turns"].forEach(id=>{
 document.getElementById(id).oninput=updateGeom;
});

function resetSim(){
 init();
 t = 0;
}

function step(){
 let dt=0.03;
 let kVal=+k.value,IampVal=+Iamp.value,BzVal=+Bz.value;
 let ksVal=+ks.value,knVal=+kn.value,cVal=+c.value,mVal=+mass.value;

 for(let i=0;i<pos.length;i++){
  let p=i/pos.length;
  let I=IampVal*Math.sin(2*t-kVal*p);
  let F=new THREE.Vector3();

  F.add(base[i].clone().sub(pos[i]).multiplyScalar(ksVal));
  if(i>0) F.add(pos[i-1].clone().sub(pos[i]).multiplyScalar(knVal));
  if(i<pos.length-1) F.add(pos[i+1].clone().sub(pos[i]).multiplyScalar(knVal));

  let tan=new THREE.Vector3(-base[i].y, base[i].x, 0);
  F.add(new THREE.Vector3(I*tan.y*BzVal,-I*tan.x*BzVal,0).multiplyScalar(0.002));

  F.add(vel[i].clone().multiplyScalar(-cVal));

  let acc=F.multiplyScalar(1/mVal);
  vel[i].add(acc.multiplyScalar(dt));
  pos[i].add(vel[i].clone().multiplyScalar(dt));
 }
}

function animate(){
 requestAnimationFrame(animate);

 if(runToggle.checked){
  t += 0.05;
  step();
 }

 /* ===== COLOR FIELD (RESTORES VISIBILITY) ===== */
 let colors = [];

 for(let i=0;i<pos.length;i++){
  let p = i/pos.length;
  let val = Math.sin(2*t - (+k.value)*p);

  colors.push(
   0.5 + 0.5*val,
   0.2,
   1 - 0.5*val
  );
 }

 geo.setFromPoints(pos);
 geo.setAttribute(
  'color',
  new THREE.Float32BufferAttribute(colors,3)
 );

 /* ===== SHOW LINE (RESTORED) ===== */
 if(showLine.checked){

  if(!lineObj){
   let lg = new THREE.BufferGeometry().setFromPoints(pos);
   lineObj = new THREE.Line(
    lg,
    new THREE.LineBasicMaterial({color:0xffffff})
   );
   scene.add(lineObj);
  } else {
   lineObj.geometry.setFromPoints(pos);
  }

 } else if(lineObj){
  scene.remove(lineObj);
  lineObj = null;
 }

 updateCamera();
 renderer.render(scene,camera);
}

/* ===== UNIVERSAL CAMERA CONTROLS ===== */

let isDragging = false;
let lastX = 0;
let lastY = 0;

/* ---- MOUSE ---- */
renderer.domElement.addEventListener("mousedown", (e)=>{
 isDragging = true;
 lastX = e.clientX;
 lastY = e.clientY;
});

window.addEventListener("mouseup", ()=> isDragging = false);

window.addEventListener("mousemove", (e)=>{
 if(!isDragging) return;

 let dx = e.clientX - lastX;
 let dy = e.clientY - lastY;

 azim += dx * 0.005;
 elev += dy * 0.005;

 elev = Math.max(-1.5, Math.min(1.5, elev));

 lastX = e.clientX;
 lastY = e.clientY;
});

/* ---- SCROLL (mouse + touchpad) ---- */
renderer.domElement.addEventListener("wheel", (e)=>{
 e.preventDefault();

 radius += e.deltaY * 0.3;
 radius = Math.max(50, Math.min(2000, radius));
});

/* ---- TOUCH ---- */
let lastTouchDist = null;

renderer.domElement.addEventListener("touchstart", (e)=>{

 if(e.touches.length === 1){
  isDragging = true;
  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;
 }

 if(e.touches.length === 2){
  lastTouchDist = Math.hypot(
   e.touches[0].clientX - e.touches[1].clientX,
   e.touches[0].clientY - e.touches[1].clientY
  );
 }
});

renderer.domElement.addEventListener("touchmove", (e)=>{

 e.preventDefault();

 if(e.touches.length === 1 && isDragging){

  let dx = e.touches[0].clientX - lastX;
  let dy = e.touches[0].clientY - lastY;

  azim += dx * 0.005;
  elev += dy * 0.005;

  elev = Math.max(-1.5, Math.min(1.5, elev));

  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;
 }

 if(e.touches.length === 2){

  let dist = Math.hypot(
   e.touches[0].clientX - e.touches[1].clientX,
   e.touches[0].clientY - e.touches[1].clientY
  );

  if(lastTouchDist !== null){
   let delta = dist - lastTouchDist;

   radius -= delta * 0.5;
   radius = Math.max(50, Math.min(2000, radius));
  }

  lastTouchDist = dist;
 }
});

renderer.domElement.addEventListener("touchend", ()=>{
 isDragging = false;
 lastTouchDist = null;
});

renderer.domElement.style.touchAction = "none";

init();
animate();

</script>
</body>
</html>
